name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      # setup-uv has no floating major tags — pin a concrete version.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --locked --extra dev pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - name: ruff check
        run: uv run --locked --extra dev ruff check src/ tests/
      - name: ruff format
        run: uv run --locked --extra dev ruff format --check src/ tests/
      - name: mypy
        run: uv run --locked --extra dev mypy src/yasqat/
