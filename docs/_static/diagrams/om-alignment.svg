 font-size="13" font-weight="600" fill="#0F2F5F">Indel: shift instead of substitute</text><rect x="20" y="290" width="52" height="30" rx="3" fill="#0F2F5F"/><text x="46.0" y="309.0" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#fff">E</text><rect x="76" y="290" width="52" height="30" rx="3" fill="#0F2F5F"/><text x="102.0" y="309.0" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#fff">E</text><rect x="132" y="290" width="52" height="30" rx="3" fill="#F07E26"/><text x="158.0" y="309.0" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#fff">U</text><rect x="188" y="290" width="52" height="30" rx="3" fill="#0E7C6B"/><text x="214.0" y="309.0" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#fff">T</text><rect x="76" y="326" width="52" height="30" rx="3" fill="#0F2F5F"/><text x="102.0" y="345.0" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#fff">E</text><rect x="132" y="326" width="52" height="30" rx="3" fill="#F07E26"/><text x="158.0" y="345.0" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#fff">U</text><rect x="188" y="326" width="52" height="30" rx="3" fill="#0E7C6B"/><text x="214.0" y="345.0" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#fff">T</text><rect x="244" y="326" width="52" height="30" rx="3" fill="#0F2F5F"/><text x="270.0" y="345.0" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#fff">E</text><rect x="20" y="326" width="52" height="30" rx="3" fill="none" stroke="#6C7A89" stroke-dasharray="4 3"/><text x="46" y="345" text-anchor="middle" font-family="Cascadia Code,Consolas,Menlo,monospace" font-size="11" fill="#6C7A89">gap</text><text x="320" y="312" font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A41">one deletion + one insertion = 2 × indel</text><text x="320" y="332" font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" fill="#6C7A89">the same run of states, shifted one step, stays close</text></svg>
